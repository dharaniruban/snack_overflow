# SSE clients authenticate with ?token=<jwt> because EventSource cannot set
# headers. The default combined log format records the full request line —
# including the query string — which would write live JWTs to disk. This
# format logs method + path only, dropping all arguments.
log_format sse_no_query '$remote_addr - $remote_user [$time_local] '
                        '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                        '"$http_referer" "$http_user_agent"';

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # SSE stream: /api/events -> backend /events. Buffering must be off.
  location /api/events {
    # Never log the query string here: it carries the JWT.
    access_log /var/log/nginx/access.log sse_no_query;
    proxy_pass http://backend:4000/events;
    proxy_http_version 1.1;
    proxy_set_header Connection '';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
  }

  # REST API: /api/<path> -> backend /<path>
  location /api/ {
    proxy_pass http://backend:4000/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
